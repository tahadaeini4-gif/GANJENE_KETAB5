<style>

body{

<body>
<div id="root"></div>

<script>
const API_URL="/api";

const GRADES=["هفتم","هشتم","نهم"];

const DEFAULT_SUBJECTS=[
"علمی","زندگی‌نامه","کمک درسی","داستان و رمان","شعر و ادبیات",
"تاریخ","جغرافیا","دینی و اخلاقی","هنر","ورزش",
"کامپیوتر و فناوری","مهارت‌های زندگی","طنز و سرگرمی","مرجع و دایرةالمعارف"
];

const SUBJECT_ICONS={
"علمی":"bi bi-beaker",
"زندگی‌نامه":"bi bi-person-vcard",
"کمک درسی":"bi bi-pencil-square",
"داستان و رمان":"bi bi-book",
"شعر و ادبیات":"bi bi-feather",
"تاریخ":"bi bi-bank",
"جغرافیا":"bi bi-globe2",
"دینی و اخلاقی":"bi bi-moon-stars",
"هنر":"bi bi-palette",
"ورزش":"bi bi-trophy",
"کامپیوتر و فناوری":"bi bi-pc-display",
"مهارت‌های زندگی":"bi bi-compass",
"طنز و سرگرمی":"bi bi-emoji-smile",
"مرجع و دایرةالمعارف":"bi bi-journals"
};

const QUOTES=[
"کتاب خوب، دوستی است که هرگز تو را ترک نمی‌کند.",
"هر صفحه‌ای که می‌خوانی، پنجره‌ای تازه به دنیاست.",
"خواندن، ورزش مغز است.",
"هر کتاب، ماجرایی تازه برای ذهن توست.",
"کتاب، کلید گنجینه‌ی دانایی است."
];

const DAY=86400000;
const MAX_LEVEL=20;
const INACTIVE_LEVEL_NAME="غیرفعال";
const INACTIVE_LEVEL_DESC="برای فعال‌سازی یک کتاب سفارش بدهید.";

function createDefaultState(){
return{
cats:DEFAULT_SUBJECTS.map((name,index)=>({id:`c${index}`,name})),
students:[],
books:[],
res:[],
over:{},
recs:[],
directRecs:[],
scoreHistory:[],
model:[],
top:null,
days:7,
pw:"admin123",
level2Threshold:10,
levelNames:{}
};
}

let S=createDefaultState();
let U=null;
let V={v:"login"};
let HISTORY=[];
let ROLE="";
let SEARCH="";
let RES_SEARCH="";
let READ_SEARCH="";
let BOOKED_SEARCH="";
let STUDENT_SEARCH="";
let SETTINGS_UNLOCKED=false;
const SETTINGS_VIEWS=["settings","booksExcel","students","progress"];

function settingsPassword(){
return String(S.settingsPw||S.pw||"admin123");
}
let CLOUD_READY=false;
let CLOUD_SAVING=false;
let CLOUD_LOADING=false;

const $=selector=>document.querySelector(selector);

function currentTheme(){
return document.documentElement.getAttribute("data-bs-theme")==="dark"?"dark":"light";
}

function themeIcon(){
return currentTheme()==="dark"?"bi-sun-fill":"bi-moon-stars-fill";
}

function toggleTheme(){
const next=currentTheme()==="dark"?"light":"dark";
document.documentElement.setAttribute("data-bs-theme",next);
try{localStorage.setItem("theme",next)}catch(e){}
document.querySelectorAll(".theme-toggle i").forEach(i=>{i.className="bi "+themeIcon()});
}

function escapeHTML(value){
return String(value??"").replace(/[&<>"']/g,char=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[char]));
}

function createId(prefix="id"){
return`${prefix}-${Date.now()}-${Math.random().toString(36).slice(2,9)}`;
}

function generateStudentCode(){
return"ST"+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,7).toUpperCase();
}

function dateFa(value){
if(!value)return"-";
try{return new Date(value).toLocaleDateString("fa-IR")}
catch{return"-"}
}

function hashString(value){
let hash=7;
for(const char of String(value))hash=(hash*31+char.charCodeAt(0))>>>0;
return hash;
}

function findStudent(code){
return(S.students||[]).find(s=>String(s.code)===String(code));
}

function findBook(ip){
return(S.books||[]).find(b=>String(b.ip)===String(ip));
}

function bookName(book){
if(!book)return"";
return S.over?.[book.ip]?.name||book.name||"";
}

function activeReservation(ip){
return(S.res||[]).find(r=>String(r.book)===String(ip)&&!r.done&&!r.delivered);
}

function reservationExpired(r){
return Date.now()>=Number(r.due||0);
}

function gradeFrom(value){
const text=String(value??"").trim();
return GRADES.find(g=>text.includes(g))||text;
}

function normalizeHeader(value){
return String(value??"").replace(/\u200c/g," ").replace(/\s+/g," ").trim();
}

function normalizeState(data){
const base=createDefaultState();
const state=data&&typeof data==="object"?data:base;

state.settingsPw=String(state.settingsPw||"");
if(!Array.isArray(state.cats)||!state.cats.length)state.cats=base.cats;
if(!Array.isArray(state.students))state.students=[];
if(!Array.isArray(state.books))state.books=[];
if(!Array.isArray(state.res))state.res=[];
if(!state.over||typeof state.over!=="object")state.over={};
if(!Array.isArray(state.recs))state.recs=[];
if(!Array.isArray(state.directRecs))state.directRecs=[];
if(!Array.isArray(state.scoreHistory))state.scoreHistory=[];
if(!Array.isArray(state.model))state.model=[];
if(!Number(state.days))state.days=7;
if(!state.pw)state.pw="admin123";
if(!Number(state.level2Threshold))state.level2Threshold=10;
if(!state.levelNames||typeof state.levelNames!=="object")state.levelNames={};
const normalizedLevelNames={};
for(let n=1;n<=MAX_LEVEL;n++){
normalizedLevelNames[n]=String(state.levelNames[n]||"").trim()||`سطح ${n}`;
}
state.levelNames=normalizedLevelNames;

const usedCodes=new Set();

const clone=o=>JSON.parse(JSON.stringify(o));
const KEYED={cats:"id",students:"code",books:"ip",res:"id",directRecs:"id",scoreHistory:"id",recs:"id"};
const SCALARS=["pw","settingsPw","days","level2Threshold","levelNames","top","model"];
let BASE=null;          // آخرین نسخه‌ی سرور
let SERVER_VERSION=-1;
let SAVE_DIRTY=false;

function computePatch(cur,base){
const p={set:{},cols:{},over:{set:{},remove:[]}};
let any=false;
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
SCALARS.forEach(k=>{if(!same(cur[k],base[k])){p.set[k]=cur[k];any=true}});
Object.entries(KEYED).forEach(([col,key])=>{
const c=(cur[col]||[]),b=(base[col]||[]);
const bm=new Map(b.map(x=>[String(x[key]),x]));
const cm=new Map(c.map(x=>[String(x[key]),x]));
const d={add:[],remove:[],change:{}};
c.forEach(x=>{
const id=String(x[key]),o=bm.get(id);
if(!o){d.add.push(x);return}
if(same(x,o))return;
const fields={},ch={};
Object.keys(x).forEach(f=>{
if(same(x[f],o[f]))return;
if(col==="students"&&f==="pts")ch.ptsDelta=Number(x.pts||0)-Number(o.pts||0);
else fields[f]=x[f];
});
if(Object.keys(fields).length)ch.fields=fields;
if(Object.keys(ch).length)d.change[id]=ch;
});
b.forEach(x=>{if(!cm.has(String(x[key])))d.remove.push(String(x[key]))});
if(d.add.length||d.remove.length||Object.keys(d.change).length){p.cols[col]=d;any=true}
});
const co=cur.over||{},bo=base.over||{};
Object.keys(co).forEach(k=>{if(!same(co[k],bo[k])){p.over.set[k]=co[k];any=true}});
Object.keys(bo).forEach(k=>{if(!(k in co)){p.over.remove.push(k);any=true}});
return any?p:null;
}

async function loadState(){
try{
const response=await fetch(API_URL+"/state?t="+Date.now(),{cache:"no-store"});
if(!response.ok)throw new Error("GET "+response.status);
const result=await response.json();
if(!result||!result.state)throw new Error("state not found");
CLOUD_READY=true;
SERVER_VERSION=result.version;
const wasEmpty=!Object.keys(result.state).length;
const st=normalizeState(result.state);
if(wasEmpty){
// اولین اجرای سرور: داده‌های پیش‌فرض را روی سرور بنویس
const r2=await fetch(API_URL+"/import",{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(st)});
const j2=await r2.json();
if(j2.ok)SERVER_VERSION=j2.version;
}
BASE=clone(st);
return st;
}catch(error){
CLOUD_READY=false;
console.error(error);
BASE=null;
return normalizeState(createDefaultState());
}
}

// ذخیره: فقط تغییرات ارسال می‌شود تا تغییرات دیگران پاک نشود
async function saveState(){
if(CLOUD_SAVING){SAVE_DIRTY=true;return false}
if(!BASE)BASE=normalizeState(createDefaultState());
CLOUD_SAVING=true;
let ok=false;
try{
do{
SAVE_DIRTY=false;
const cur=normalizeState(S);
const patch=computePatch(cur,BASE);
if(!patch){ok=true;continue}
const response=await fetch(API_URL+"/patch",{
method:"POST",
headers:{"Content-Type":"text/plain;charset=utf-8"},
body:JSON.stringify(patch)
});
if(!response.ok)throw new Error("POST "+response.status);
const result=await response.json();
if(!result||result.ok===false)throw new Error(result?.error||"save failed");
SERVER_VERSION=result.version;
const merged=normalizeState(result.state);
BASE=clone(merged);
if(!SAVE_DIRTY)S=merged;   // وضعیت را با سرور یکی کن (شامل تغییرات دیگران)
ok=true;
}while(SAVE_DIRTY);
CLOUD_READY=true;
return ok;
}catch(error){
CLOUD_READY=false;
console.error(error);
return false;
}finally{
CLOUD_SAVING=false;
}
}

return !!a&&["INPUT","TEXTAREA","SELECT"].includes(a.tagName)&&a.id!=="loginInput";

async function pollChanges(){
if(CLOUD_SAVING||SAVE_DIRTY||!U)return;
try{
const r=await fetch(API_URL+"/version?t="+Date.now(),{cache:"no-store"});
const j=await r.json();
if(j.version===SERVER_VERSION)return;
if(userIsTyping())return;           // وسط تایپ ریدرندر نکن
const st=await loadState();
if(!CLOUD_READY)return;
S=st;
render();
}catch(e){}
}
setInterval(pollChanges,4000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pollChanges()});

type,

};

function formatScore(value){
const n=Number(value||0);
return Number.isInteger(n)
?n.toLocaleString("fa-IR")
:n.toLocaleString("fa-IR",{maximumFractionDigits:1});
}

function signedScore(value){
const n=Number(value||0);
return(n<0?"-":"+")+formatScore(Math.abs(n));
}

function normalizeDigits(value){
return String(value??"")
.replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d))
.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))
.trim().toLowerCase();
}

}

function findColumnIndexes(rows){
const aliases={
name:["نام کتاب","عنوان کتاب","نام"],
subject:["موضوع","دسته بندی","دسته‌بندی","دسته"],
author:["نام نویسنده","نویسنده","مولف","مؤلف"],
date:["تاریخ انتشار","تاریخ"],
grade:["پایه تحصیلی","پایه","مقطع"],
ip:["ip","شماره کتاب","شماره"]
};

let headerIndex=-1;

for(let i=0;i<Math.min(rows.length,15);i++){
const normalized=rows[i].map(normalizeHeader);

if(
normalized.some(x=>aliases.name.includes(x))&&
normalized.some(x=>aliases.subject.includes(x))
){
headerIndex=i;
break;
}
}

if(headerIndex===-1)return null;

const header=rows[headerIndex].map(normalizeHeader);
const indexes={};

Object.entries(aliases).forEach(([key,names])=>{
indexes[key]=header.findIndex(cell=>names.includes(cell));
});

return{headerIndex,indexes};
}

function importBooks(addToExisting=false){
const input=$("#booksExcel");
const file=input?.files?.[0];

if(!file){
alert("فایل Excel را انتخاب کنید.");
return;
}

readExcel(file,rows=>{
const structure=findColumnIndexes(rows);

if(!structure){
alert("ساختار فایل شناسایی نشد.");
return;
}

const{headerIndex,indexes}=structure;

const existingIps=new Set(
addToExisting?S.books.map(b=>String(b.ip)):[]
);

let nextIp=Math.max(0,...S.books.map(b=>Number(b.ip)||0));
const imported=[];

for(let i=headerIndex+1;i<rows.length;i++){
const row=rows[i];

const name=String(row[indexes.name]??"").trim();
if(!name)continue;

const subject=indexes.subject>=0?String(row[indexes.subject]??"").trim():"";
const author=indexes.author>=0?String(row[indexes.author]??"").trim():"";
const date=indexes.date>=0?String(row[indexes.date]??"").trim():"";
const grade=indexes.grade>=0?gradeFrom(row[indexes.grade]):"";

let ip=indexes.ip>=0?String(row[indexes.ip]??"").trim():"";

if(!ip||existingIps.has(ip)){
do{
nextIp++;
ip=String(nextIp);
}while(existingIps.has(ip));
}

existingIps.add(ip);
ensureCategory(subject);

imported.push({ip,name,subject,author,date,grade});
}

if(!imported.length){
alert("هیچ کتابی پیدا نشد.");
return;
}

S.books=addToExisting?[...S.books,...imported]:imported;

saveState();
alert(`${imported.length} کتاب ثبت شد.`);
input.value="";
render();
});
}

function selectLoginRole(role){
ROLE=role;

const form=$("#loginForm");
const label=$("#loginLabel");
const input=$("#loginInput");
const status=$("#loginStatus");

if(!form||!input)return;

form.classList.remove("d-none");

label.textContent=role==="student"
?"رمز عبور دانش‌آموز را وارد کنید"
:"رمز مدیر را وارد کنید";

input.type="password";
input.placeholder=role==="student"?"رمز عبور دانش‌آموز":"رمز مدیر";
input.value="";

if(status)status.textContent="";

setTimeout(()=>input.focus(),50);
}

async function doLogin(){
const input=$("#loginInput");
const value=input?.value.trim();

if(!value){
alert("رمز عبور را وارد کنید.");
return;
}

const button=$("#loginButton");

if(button){
button.disabled=true;
button.innerHTML='<span class="spinner-border spinner-border-sm"></span> ورود';
}

try{
if(ROLE==="admin"){
const adminPassword=String(S.pw||"admin123");

if(value!==adminPassword){
alert("رمز مدیر اشتباه است.");
return;
}

U={role:"admin",name:"مدیر"};
U.quote=QUOTES[Math.floor(Math.random()*QUOTES.length)];
navigateRoot("home");
return;
}

if(ROLE==="student"){
const student=S.students.find(s=>String(s.password||"")===value);

if(!student){
alert("رمز عبور دانش‌آموز اشتباه است.");
return;
}

U={
role:"student",
code:String(student.code),
name:student.name,
quote:QUOTES[Math.floor(Math.random()*QUOTES.length)]
};

navigateRoot("home");
return;
}

alert("ابتدا نقش ورود را انتخاب کنید.");
}finally{
if(button){
button.disabled=false;
button.innerHTML="ورود";
}
}
}

function drawBookGrid(){

if(!grid)return;

const query=SEARCH.trim().toLowerCase();

const books=booksByCategory(V.id).filter(book=>{
const text=`${bookName(book)} ${book.author}`.toLowerCase();
return!query||text.includes(query);
});

const counts=readCountMap();
books.sort((a,b)=>(counts[String(b.ip)]||0)-(counts[String(a.ip)]||0));

if(!books.length){
grid.innerHTML=`
<div class="col-12">
<div class="empty-state card-modern">

function reserveBook(ip){
if(U.role!=="student"){
alert("این امکان فقط برای دانش‌آموزان است.");
return;
}

const book=findBook(ip);

if(!book){
alert("کتاب پیدا نشد.");
return;
}

if(activeReservation(ip)){
alert("این کتاب قبلاً رزرو شده است.");
return;
}

const student=findStudent(U.code);

if(!student){
alert("اطلاعات دانش‌آموز پیدا نشد.");
return;
}

const days=Math.max(1,Number(S.days)||7);

const reservation={
id:createId("reservation"),
book:String(ip),
student:String(U.code),
createdAt:Date.now(),
due:Date.now()+days*DAY,
done:false,
read:false,
readAt:null,
rating:0,
comment:"",
readAwarded:false,
ratingAwarded:false,
presentation:false,
presentationAt:null,
presentationAwarded:false
};

S.res.push(reservation);

saveState();

V={v:"success",ip};
render();
}

function togglePresentation(id){
if(U?.role!=="admin"){
alert("ثبت ارائه کتاب فقط توسط مدیر انجام می‌شود.");
return;
}

const reservation=(S.res||[]).find(r=>String(r.id)===String(id));

if(!reservation){
alert("رزرو پیدا نشد.");
return;
}

const student=findStudent(reservation.student);
const book=findBook(reservation.book);

if(!reservation.presentation){

reservation.presentation=true;
reservation.presentationAt=Date.now();

if(!reservation.presentationAwarded){
const added=addScore(reservation.student,"presentation",{
book:reservation.book,
uniqueKey:`presentation-admin-${reservation.id}`
});

reservation.presentationAwarded=added||reservation.presentationAwarded;
}

saveState();

alert(`ارائه کتاب برای «${student?.name||"دانش‌آموز"}» ثبت شد.`);

}else{

reservation.presentation=false;
reservation.presentationAt=null;

if(reservation.presentationAwarded){
const scoreIndex=S.scoreHistory.findIndex(x=>
String(x.uniqueKey)===`presentation-admin-${reservation.id}`
);

if(scoreIndex>=0){
const score=S.scoreHistory[scoreIndex];
const target=findStudent(reservation.student);

if(target){
target.pts=Math.max(0,Number(target.pts||0)-Number(score.amount||0));
}

S.scoreHistory.splice(scoreIndex,1);
}

reservation.presentationAwarded=false;
}

saveState();

alert("ثبت ارائه کتاب لغو شد.");
}

render();
}

function removePenalty(uniqueKey){
const index=(S.scoreHistory||[]).findIndex(x=>String(x.uniqueKey)===uniqueKey);
if(index<0)return;

const score=S.scoreHistory[index];
const student=findStudent(score.student);

if(student)student.pts=Number(student.pts||0)-Number(score.amount||0);

S.scoreHistory.splice(index,1);
}

function undoGiven(id){
const reservation=(S.res||[]).find(r=>String(r.id)===String(id));
if(!reservation||reservation.read)return;
if(!confirm("این کتاب به لیست رزروها برگردانده شود؟"))return;
reservation.given=false;
reservation.givenAt=null;
saveState();
render();
}

function returnBook(id){
if(U?.role!=="admin"){
alert("ثبت تحویل فقط توسط مدیر انجام می‌شود.");
return;
}

const reservation=(S.res||[]).find(r=>String(r.id)===String(id));
if(!reservation||reservation.read){
alert("رزرو پیدا نشد یا قبلاً تحویل ثبت شده است.");
return;
}

const student=findStudent(reservation.student);
if(!student){
alert("دانش‌آموز این رزرو پیدا نشد.");
return;
}

const damaged=!!document.getElementById(`condBad_${id}`)?.checked;
const late=!!document.getElementById(`condLate_${id}`)?.checked;

reservation.delivered=true;
reservation.deliveredAt=Date.now();
reservation.read=true;
reservation.done=true;
reservation.readAt=Date.now();
reservation.condition=damaged?"damaged":"good";
reservation.late=late;
reservation.conditionAt=Date.now();

const notes=["۱ امتیاز مطالعه اضافه شد"];

const added=addScore(reservation.student,"read",{
book:reservation.book,
uniqueKey:`read-admin-${reservation.id}`
});
reservation.readAwarded=added||reservation.readAwarded;

if(damaged){
addScore(reservation.student,"damaged",{book:reservation.book,uniqueKey:`damaged-admin-${reservation.id}`});
notes.push(`کتاب آسیب‌دیده: ${signedScore(SCORE_TYPES.damaged.amount)}`);
}

if(late){
addScore(reservation.student,"late",{book:reservation.book,uniqueKey:`late-admin-${reservation.id}`});
notes.push(`دیرکرد: ${signedScore(SCORE_TYPES.late.amount)}`);
}

saveState();
alert(`تحویل کتاب برای «${student.name}» ثبت شد و به «» رفت.\n${notes.join("\n")}`);
render();
}

const target=S.res.find(r=>String(r.id)===String(id));

if(target&&target.read){
if(!confirm("این رزرو از لیست رزروها حذف شود؟ کتاب در «کتابخاه خوانده‌شده‌ها» و سابقه و امتیاز دانش‌آموز باقی می‌ماند."))return;
target.hidden=true;
saveState();
render();
return;
}

if(!confirm("این رزرو حذف شود؟"))return;

const reservation=target;

if(reservation){

const scoreKeys=[
`read-admin-${reservation.id}`,
`presentation-admin-${reservation.id}`,
`rating-${reservation.id}`,
`damaged-admin-${reservation.id}`,
`late-admin-${reservation.id}`
];

scoreKeys.forEach(key=>{
const index=S.scoreHistory.findIndex(x=>String(x.uniqueKey)===key);

if(index>=0){
const score=S.scoreHistory[index];
const student=findStudent(score.student);

if(student){
student.pts=Math.max(0,Number(student.pts||0)-Number(score.amount||0));
}

S.scoreHistory.splice(index,1);
}
});

}

S.res=S.res.filter(r=>String(r.id)!==String(id));

saveState();
render();
}

function normFa(value){
return String(value??"")
.replace(/ي/g,"ی")
.replace(/ك/g,"ک")
.replace(/\u200c/g," ")
.replace(/\s+/g," ")
.trim();
}

function digitsEn(value){
return String(value??"")
.replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d))
.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
}

function gradeFromClass(value){
const text=normFa(digitsEn(value));
const byName=GRADES.find(g=>text.includes(g));
if(byName)return byName;
const map={"7":"هفتم","8":"هشتم","9":"نهم"};
return map[text.charAt(0)]||"";
}

function usedPasswordSet(){

function generateRandomPassword(used){
const lengths=[5,7];
for(let tries=0;tries<10000;tries++){
const len=lengths[Math.floor(Math.random()*lengths.length)];
const buf=new Uint32Array(len);
crypto.getRandomValues(buf);
let pw=String(1+(buf[0]%9));
for(let i=1;i<len;i++)pw+=String(buf[i]%10);
if(!used.has(pw)){
used.add(pw);
return pw;
}
}
throw new Error("password generation failed");
}

function xmlEsc(v){
return String(v??"")
.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"")
.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function crc32(bytes){
if(!crc32.table){
crc32.table=new Uint32Array(256);
for(let n=0;n<256;n++){
let c=n;
for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;
crc32.table[n]=c>>>0;
}
}
let crc=0xFFFFFFFF;
for(let i=0;i<bytes.length;i++)crc=crc32.table[(crc^bytes[i])&255]^(crc>>>8);
return(crc^0xFFFFFFFF)>>>0;
}

function buildZip(files){
const enc=new TextEncoder();
const chunks=[];
const central=[];
let offset=0;

const u16=v=>[v&255,(v>>>8)&255];
const u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];

files.forEach(f=>{
const name=enc.encode(f.name);
const data=typeof f.data==="string"?enc.encode(f.data):f.data;
const crc=crc32(data);

const local=new Uint8Array([
...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x0021),
...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)
]);

chunks.push(local,name,data);

central.push(new Uint8Array([
...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x0021),
...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),
...u16(0),...u16(0),...u32(0),...u32(offset)
]),name);

offset+=local.length+name.length+data.length;
});

let centralSize=0;
central.forEach(c=>centralSize+=c.length);

const end=new Uint8Array([
...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),
...u32(centralSize),...u32(offset),...u16(0)
]);

return new Blob([...chunks,...central,end],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

function cardRoundRect(ctx,x,y,w,h,r){
ctx.beginPath();
ctx.moveTo(x+r,y);
ctx.arcTo(x+w,y,x+w,y+h,r);
ctx.arcTo(x+w,y+h,x,y+h,r);
ctx.arcTo(x,y+h,x,y,r);
ctx.arcTo(x,y,x+w,y,r);
ctx.closePath();
}

function cardSparkle(ctx,x,y,r,color){
ctx.fillStyle=color;
ctx.beginPath();
ctx.moveTo(x,y-r);
ctx.quadraticCurveTo(x,y,x+r,y);
ctx.quadraticCurveTo(x,y,x,y+r);
ctx.quadraticCurveTo(x,y,x-r,y);
ctx.quadraticCurveTo(x,y,x,y-r);
ctx.fill();
}

async function downloadPasswordsDoc(list,filename){
if(!list||!list.length){
alert("دانش‌آموزی برای ساخت فایل وجود ندارد.");
return;
}

try{
showBusy("در حال ساخت فایل Word ...");

try{
await document.fonts.load('800 40px Vazirmatn');
await document.fonts.load('500 20px Vazirmatn');
}catch(e){}

const canvas=document.createElement("canvas");
canvas.width=800;
canvas.height=500;
const ctx=canvas.getContext("2d");

const PER_ROW=2,ROWS=5,PER_PAGE=PER_ROW*ROWS;
const CELL_W=4762,ROW_H=3062;
const EMU_W=2880000,EMU_H=1800000;

const media=[];
const rels=[];

const imageXml=(n,name)=>`<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/><w:jc w:val="center"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${EMU_W}" cy="${EMU_H}"/><wp:docPr id="${n}" name="Card ${n}" descr="${xmlEsc(name)}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${n}" name="card${n}.jpeg"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rId${n+10}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${EMU_W}" cy="${EMU_H}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;

const emptyPara=`<w:p><w:pPr><w:spacing w:before="0" w:after="0"/></w:pPr></w:p>`;

const cellXml=content=>`<w:tc><w:tcPr><w:tcW w:w="${CELL_W}" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>${content}</w:tc>`;

let body="";

for(let start=0;start<list.length;start+=PER_PAGE){
const page=list.slice(start,start+PER_PAGE);
const rowCount=Math.ceil(page.length/PER_ROW);

if(start>0){
body+=`<w:p><w:pPr><w:pageBreakBefore/><w:spacing w:before="0" w:after="0" w:line="20" w:lineRule="exact"/></w:pPr></w:p>`;
}

let rows="";

for(let r=0;r<rowCount;r++){
let cells="";

for(let c=0;c<PER_ROW;c++){
const student=page[r*PER_ROW+c];

if(!student){
cells+=cellXml(emptyPara);
continue;
}

drawStudentCard(ctx,student);

const blob=await new Promise(res=>canvas.toBlob(res,"image/jpeg",0.92));
const bytes=new Uint8Array(await blob.arrayBuffer());
const n=media.length+1;

media.push({name:`word/media/card${n}.jpeg`,data:bytes});
rels.push(`<Relationship Id="rId${n+10}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/card${n}.jpeg"/>`);

cells+=cellXml(imageXml(n,student.name));
}

rows+=`<w:tr><w:trPr><w:cantSplit/><w:trHeight w:val="${ROW_H}" w:hRule="exact"/></w:trPr>${cells}</w:tr>`;
}

body+=`<w:tbl><w:tblPr><w:tblW w:w="${CELL_W*PER_ROW}" w:type="dxa"/><w:jc w:val="center"/><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="0" w:type="dxa"/><w:right w:w="0" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid><w:gridCol w:w="${CELL_W}"/><w:gridCol w:w="${CELL_W}"/></w:tblGrid>${rows}</w:tbl>`;

if(start%PER_PAGE===0&&start%25===0)await new Promise(r=>setTimeout(r,0));
}

body+=`<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="20" w:lineRule="exact"/></w:pPr></w:p>`;

const documentXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="454" w:right="1191" w:bottom="454" w:left="1191" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr></w:body></w:document>`;

const contentTypes=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`;

const rootRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;

const docRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels.join("")}</Relationships>`;

const blob=buildZip([
{name:"[Content_Types].xml",data:contentTypes},
{name:"_rels/.rels",data:rootRels},
{name:"word/document.xml",data:documentXml},
{name:"word/_rels/document.xml.rels",data:docRels},
...media
]);

const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download=(filename||"student-passwords.docx").replace(/\.doc$/i,".docx");
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(()=>URL.revokeObjectURL(url),4000);
}catch(error){
console.error(error);
alert("ساخت فایل Word انجام نشد.");
}finally{
showBusy("");
}
}

function processStudentRows(rows){
const aliases={
nid:["کد ملی","کدملی","شماره ملی"],
full:["نام و نام خانوادگی","نام ونام خانوادگی"],
first:["نام"],
last:["نام خانوادگی","فامیل","فامیلی"],
cls:["کلاس","پایه","کلاس/پایه"]
};

let map=null;
const usedCodes=new Set(S.students.map(s=>String(s.code)));
const result={added:[],existing:0,invalid:0,duplicateInFile:0,conflict:0};
const seenInFile=new Set();
const usedPasswords=usedPasswordSet();

rows.forEach(row=>{
const header=row.map(c=>normFa(c));
const nidIndex=header.findIndex(c=>aliases.nid.includes(c));
const hasName=header.some(c=>aliases.full.includes(c)||aliases.first.includes(c));

if(nidIndex>=0&&hasName){
map={nid:nidIndex};
Object.entries(aliases).forEach(([key,names])=>{
if(key!=="nid")map[key]=header.findIndex(c=>names.includes(c));
});
return;
}

if(!map)return;

let nid=digitsEn(row[map.nid]).replace(/\D/g,"");
if(!nid)return;

if(nid.length<10)nid=nid.padStart(10,"0");

const name=map.full>=0&&normFa(row[map.full])
?normFa(row[map.full])
:normFa(`${map.first>=0?row[map.first]:""} ${map.last>=0?row[map.last]:""}`);

if(nid.length!==10||!name){
result.invalid++;
return;
}

if(seenInFile.has(nid)){
result.duplicateInFile++;
return;
}

seenInFile.add(nid);

if(S.students.some(s=>String(s.nid)===nid)){
result.existing++;
return;
}

const cls=map.cls>=0?normFa(digitsEn(row[map.cls])):"";

let code=generateStudentCode();
while(usedCodes.has(code))code=generateStudentCode();
usedCodes.add(code);

result.added.push({
code,
name,
grade:gradeFromClass(cls),
cls,
nid,
password:generateRandomPassword(usedPasswords),
pts:0
});
});

return result;
}

function importStudents(){
const input=$("#studentsExcel");
const file=input?.files?.[0];

if(!file){
alert("فایل Excel را انتخاب کنید.");
return;
}

readExcel(file,rows=>{
const result=processStudentRows(rows);

if(!result.added.length){
alert(`دانش‌آموز جدیدی برای افزودن پیدا نشد.\nتکراری (قبلاً ثبت‌شده): ${result.existing}\nنامعتبر: ${result.invalid}`);
return;
}

if(!confirm(`${result.added.length} دانش‌آموز جدید اضافه شود؟\nرمز تصادفی ۵ یا ۷ رقمی برای هر دانش‌آموز ساخته می‌شود.`))return;

S.students.push(...result.added);

saveState();

alert(`${result.added.length} دانش‌آموز اضافه شد.\nتکراری (قبلاً ثبت‌شده): ${result.existing}\nنامعتبر: ${result.invalid}\n\nفایل Word رمزها دانلود می‌شود.`);

downloadPasswordsDoc(result.added,"student-passwords.docx");

input.value="";
render();
});
}

function addStudent(){
const name=prompt("نام و نام خانوادگی:");

if(!name?.trim())return;

const grade=prompt("پایه تحصیلی:","هفتم")||"";

let password=prompt("رمز عبور دانش‌آموز (خالی بگذارید تا رمز تصادفی ساخته شود):");

if(password===null)return;

password=password.trim();

if(!password)password=generateRandomPassword(usedPasswordSet());

if(S.students.some(s=>String(s.password)===password)){
alert("این رمز قبلاً برای دانش‌آموز دیگری ثبت شده است. رمز دیگری انتخاب کنید.");
return;
}

const code=generateStudentCode();

S.students.push({
code,
name:name.trim(),
grade:grade.trim(),
password,
pts:0
});

saveState();

alert(`دانش‌آموز «${name.trim()}» ثبت شد.`);

render();
}

function editStudent(code){
const student=findStudent(code);

if(!student)return;

const name=prompt("نام:",student.name);

if(name===null)return;

const grade=prompt("پایه:",student.grade||"");

if(grade===null)return;

const password=prompt("رمز عبور:",student.password||"");

if(password===null)return;

const cleanPassword=password.trim();

if(!cleanPassword){
alert("رمز عبور نمی‌تواند خالی باشد.");
return;
}

const duplicate=S.students.some(s=>
String(s.code)!==String(code)&&
String(s.password)===cleanPassword
);

if(duplicate){
alert("این رمز قبلاً برای دانش‌آموز دیگری ثبت شده است.");
return;
}

student.name=name.trim();
student.grade=grade.trim();
student.password=cleanPassword;

saveState();
render();
}

function deleteStudent(code){
if(!confirm("این دانش‌آموز حذف شود؟"))return;

S.students=S.students.filter(s=>String(s.code)!==String(code));

S.res=S.res.filter(r=>String(r.student)!==String(code));

S.directRecs=S.directRecs.filter(r=>
String(r.fromCode)!==String(code)&&
String(r.toCode)!==String(code)
);

S.scoreHistory=S.scoreHistory.filter(x=>String(x.student)!==String(code));

saveState();
render();
}

if(!confirm("این کتاب حذف شود؟"))return;

S.books=S.books.filter(b=>String(b.ip)!==String(ip));

S.res=S.res.filter(r=>String(r.book)!==String(ip));

S.directRecs=S.directRecs.filter(r=>String(r.book)!==String(ip));

S.scoreHistory=S.scoreHistory.filter(x=>String(x.book)!==String(ip));

delete S.over[ip];

saveState();
navigateRoot("home");
}

function saveBookEdit(ip){
const book=findBook(ip);

if(!book)return;

const name=$("#editBookName")?.value.trim();
const author=$("#editBookAuthor")?.value.trim();
const subject=$("#editBookSubject")?.value.trim();
const date=$("#editBookDate")?.value.trim();
const grade=$("#editBookGrade")?.value.trim();
const imageInput=$("#editBookImage");

if(!name){
alert("نام کتاب را وارد کنید.");
return;
}

book.name=name;
book.author=author;
book.subject=subject;
book.date=date;
book.grade=grade;

ensureCategory(subject);

const file=imageInput?.files?.[0];

if(file){

const reader=new FileReader();

reader.onload=e=>{

S.over[ip]={
...(S.over[ip]||{}),
name,
img:e.target.result
};

saveState();

alert("اطلاعات کتاب ذخیره شد.");

render();
};

reader.readAsDataURL(file);

return;
}

S.over[ip]={
...(S.over[ip]||{}),
name
};

saveState();

alert("اطلاعات کتاب ذخیره شد.");

render();
}

initializeApp();
</script>
